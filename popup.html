<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Figma Screenshot Extension</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #1557b0;
    }
    .status {
      font-size: 14px;
      color: #5f6368;
      margin-top: 10px;
    }
    .version {
      font-size: 12px;
      color: #888;
      text-align: right;
      margin-top: 10px;
    }
    .auth-status {
      font-size: 14px;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }
    .auth-status.authorized {
      background-color: #e6f4ea;
      color: #137333;
    }
    .auth-status.unauthorized {
      background-color: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="authStatus" class="auth-status"></div>
    <button id="captureFullPage">Сделать скриншот страницы</button>
    <button id="captureSelection">Выбрать область</button>
    <button id="connectFigma">Подключить Figma</button>
    <div class="status" id="status"></div>
    <div class="version">Версия <span id="version"></span></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
