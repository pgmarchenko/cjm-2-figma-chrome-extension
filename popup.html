<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Figma Screenshot Extension</title>
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
    }
    button:hover {
      background: #f5f5f5;
    }
    #status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .authorized {
      color: #34a853;
    }
    .unauthorized {
      color: #ea4335;
    }
    .file-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 10px 0;
    }
    .file-item {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }
    .file-item:hover {
      background: #f5f5f5;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    #selectedFile {
      margin: 10px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div>Версия: <span id="version"></span></div>
  <div id="authStatus"></div>
  <div id="selectedFile"></div>
  <button id="connectFigma">Подключить Figma</button>
  <button id="captureFullPage">Сделать скриншот страницы</button>
  <button id="captureSelection">Выбрать область</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
